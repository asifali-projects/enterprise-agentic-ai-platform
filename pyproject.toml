[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agentic-ai-platform"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "redis>=5.0,<6.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "bcrypt>=4.0,<5.0",
  "structlog>=24.4,<26.0",
  "email-validator>=2.2,<3.0",
  "httpx>=0.27,<1.0",
  "qdrant-client>=1.15,<2.0",
  "prometheus-client>=0.21,<1.0",
  "opentelemetry-api>=1.27,<2.0",
  "opentelemetry-sdk>=1.27,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.13,<2.0"
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app", "app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults are an accepted framework idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/*" = ["E501", "F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# "backend/tests" resolves from the repository root; "tests" resolves inside the
# container image where the backend source is flattened to the working directory.
testpaths = ["backend/tests", "tests"]

[tool.mypy]
python_version = "3.12"
# Pragmatic baseline: catch real type errors without requiring exhaustive
# annotations across FastAPI's dependency-injection surface. Tighten module by
# module over time (see docs/technical/backend.md - "Type checking").
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = false
exclude = "(alembic|tests|conftest)"
