upstream api_upstream {
  server api:8000;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # The SPA calls the API on its own origin; Nginx proxies to the API service.
  # This removes cross-origin/CORS, mixed-content and localhost-resolution
  # failure modes in the browser.
  location /api/ {
    proxy_pass http://api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /ws/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location = /metrics { proxy_pass http://api_upstream; }
  location /health/ { proxy_pass http://api_upstream; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
