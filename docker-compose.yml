services:
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ['8000:8000']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    restart: unless-stopped
    healthcheck: {test: ['CMD','python','-c','import urllib.request; urllib.request.urlopen("http://localhost:8000/health/ready")'], interval: 10s, timeout: 5s, retries: 15, start_period: 30s}
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    command: ['python','-m','app.worker']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['5173:80']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: agentic, POSTGRES_USER: agentic, POSTGRES_PASSWORD: agentic}
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck: {test: ['CMD-SHELL','pg_isready -U agentic -d agentic'], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: ['redis_data:/data']
    command: redis-server --appendonly yes
    healthcheck: {test: ['CMD','redis-cli','ping'], interval: 5s, timeout: 5s, retries: 10}
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ['6333:6333']
    volumes: ['qdrant_data:/qdrant/storage']
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
