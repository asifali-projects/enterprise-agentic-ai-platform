apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: agentic-platform}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: enterprise-agentic-ai-platform/api:latest
          command: [python, -m, app.worker]
          envFrom: [{configMapRef: {name: agentic-config}}, {secretRef: {name: agentic-secrets}}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
