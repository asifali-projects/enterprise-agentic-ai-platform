apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agentic-platform
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: enterprise-agentic-ai-platform/api:latest
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: agentic-config}}, {secretRef: {name: agentic-secrets}}]
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: agentic-platform}
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
